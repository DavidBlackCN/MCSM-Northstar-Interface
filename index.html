<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="renderer" content="webkit" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="theme-color" content="#000000" />

    <link rel="icon" href="./favicon.ico" />
    <title>MCSManager Panel</title>

    <script>
      // Apply the persisted Northstar mode/accent before the first paint so
      // the startup surface matches the app instead of briefly flashing cyan.
      (function () {
        try {
          var root = document.documentElement;
          var mode = Number(localStorage.getItem("THEME_KEY"));
          root.dataset.nsTheme = mode === 2 ? "dark" : "light";
          var accent = localStorage.getItem("northstarAccent");
          if (["cyan", "vermillion", "lotus", "gold"].indexOf(accent) !== -1) {
            root.dataset.nsAccent = accent;
          }
        } catch (_) {}
      })();
    </script>

    <style>
      #before-app-mounted {
        --loading-bg-color: #fffcf5;
        --loading-color: #292b2f;
        --loading-subtitle-color: #5c6166;
      }

      :root[data-ns-theme="dark"] #before-app-mounted {
        --loading-bg-color: #1b1c1f;
        --loading-color: #e7e8e9;
        --loading-subtitle-color: #c0c4c9;
      }

      :root[data-ns-accent="vermillion"] #before-app-mounted { --loading-accent: #ad4506; --loading-action: #913803; }
      :root[data-ns-accent="lotus"] #before-app-mounted { --loading-accent: #b06d88; --loading-action: #8c4c66; }
      :root[data-ns-accent="gold"] #before-app-mounted { --loading-accent: #9b811d; --loading-action: #806a16; }
      :root[data-ns-theme="dark"][data-ns-accent="vermillion"] #before-app-mounted { --loading-accent: #de7b43; --loading-action: #de7b43; }
      :root[data-ns-theme="dark"][data-ns-accent="lotus"] #before-app-mounted { --loading-accent: #cf89a4; --loading-action: #cf89a4; }
      :root[data-ns-theme="dark"][data-ns-accent="gold"] #before-app-mounted { --loading-accent: #d1b958; --loading-action: #d1b958; }

      @media (prefers-color-scheme: dark) {
        #before-app-mounted {
          --loading-bg-color: #1b1c1f;
          --loading-color: #e7e8e9;
          --loading-subtitle-color: #c0c4c9;
        }
      }

      #before-app-mounted {
        background: var(--loading-bg-color);
        color: var(--loading-color);
        position: fixed;
        left: 0;
        right: 0;
        top: 0;
        bottom: 0;
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      #before-app-mounted .loading-box {
        text-align: center;
        display: flex;
        justify-content: center;
        flex-direction: column;
        align-items: center;
      }

      #before-app-mounted .loading-bars {
        display: flex;
        width: 64px;
        height: 64px;
        margin: 0 0 4px;
        align-items: center;
        justify-content: center;
        gap: 7px;
      }

      #before-app-mounted .loading-bars span {
        display: block;
        width: 8px;
        height: 42px;
        border-radius: 5px;
        background: var(--loading-accent, #5086a1);
        transform-origin: center;
        animation: loading-bars 760ms ease-in-out infinite;
      }

      #before-app-mounted .loading-bars span:nth-child(2) { height: 56px; animation-delay: 100ms; }
      #before-app-mounted .loading-bars span:nth-child(3) { height: 32px; animation-delay: 200ms; }

      @media (prefers-color-scheme: dark) {
        #before-app-mounted .loading-bars span { background: var(--loading-accent, #76a9bc); }
      }

      @keyframes loading-bars {
        0%, 100% { transform: translateY(10px); opacity: .58; }
        50% { transform: translateY(-10px); opacity: 1; }
      }

      #before-app-mounted .loading-title {
        margin: 0 0 2px;
        font: 500 18px/1.4 "Maple Mono", ui-monospace, monospace;
        color: var(--loading-subtitle-color);
      }

      #before-app-mounted .loading-error {
        display: none;
        flex-direction: column;
        align-items: center;
        max-width: 400px;
        padding: 20px;
      }

      #before-app-mounted .loading-error.show {
        display: flex;
      }

      #before-app-mounted .error-title {
        font-size: 20px;
        font-weight: 600;
        margin-bottom: 12px;
        color: var(--loading-color);
      }

      #before-app-mounted .error-message {
        font-size: 14px;
        line-height: 1.6;
        color: var(--loading-subtitle-color);
        margin-bottom: 24px;
        text-align: center;
        word-break: break-word;
      }

      #before-app-mounted .error-button {
        padding: 10px 24px;
        font-size: 14px;
        font-weight: 500;
        color: #fff;
        background-color: var(--loading-action, #3f728d);
        border: 1px solid var(--loading-action, #3f728d);
        border-radius: 6px;
        cursor: pointer;
        transition: background-color 150ms cubic-bezier(0.23, 1, 0.32, 1), border-color 150ms cubic-bezier(0.23, 1, 0.32, 1), transform 150ms cubic-bezier(0.23, 1, 0.32, 1);
        outline: none;
      }

      #before-app-mounted .error-button:hover {
        background-color: var(--loading-accent, #5086a1);
        border-color: var(--loading-accent, #5086a1);
        transform: translateY(-1px);
      }

      #before-app-mounted .error-button:active {
        background-color: var(--loading-action, #285a70);
        transform: scale(0.98);
      }
    </style>

    <script>
      (function (window) {
        window.closeLoadingContainer = function () {
          document.getElementById("before-app-mounted").setAttribute("style", "display:none");
        };

        window.setLoadingTitle = function (title) {
            document
            .getElementById("before-app-mounted")
            .querySelector(".loading-title").textContent = title;
        };

        // Keep the native boot stages readable in the Chinese panel locale
        // without touching the official application bundle.
        (function () {
          var nativeSetLoadingTitle = window.setLoadingTitle;
          var titles = {
            "Loading application settings...": "正在读取应用设置...",
            "Initializing Application...": "正在初始化应用...",
            "Initializing Language...": "正在初始化语言...",
            "Initializing Layout...": "正在初始化布局...",
            "Downloading JavaScript Files...": "正在加载应用资源...",
            "Rendering Application...": "正在渲染应用界面..."
          };
          window.setLoadingTitle = function (title) {
            nativeSetLoadingTitle(titles[title] || title);
          };
        })();

        window.setAppLoadingError = function (error) {
          const container = document.getElementById("before-app-mounted");
          const loadingBox = container.querySelector(".loading-box");
          const errorBox = container.querySelector(".loading-error");
          const errorMessage = errorBox.querySelector(".error-message");

          // Hide loading spinner and title
          const loading = loadingBox.querySelector(".loading");
          const loadingTitle = loadingBox.querySelector(".loading-title");
          if (loading) loading.style.display = "none";
          if (loadingTitle) loadingTitle.style.display = "none";

          // Show error box with message
          errorMessage.textContent = error;
          errorBox.classList.add("show");
        };
      })(window);
    </script>
    <script type="module" crossorigin src="./assets/index-00669f70.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/vue-c5306860.js">
    <link rel="modulepreload" crossorigin href="./assets/ant-658e87c0.js">
    <link rel="modulepreload" crossorigin href="./assets/ant-es-3a73426e.js">
    <link rel="modulepreload" crossorigin href="./assets/lodash-8e96bb37.js">
    <link rel="stylesheet" href="./assets/ant-25a63267.css">
    <link rel="stylesheet" href="./northstar-v10.css?v=20260819-15">
  </head>
  <body>
    <div id="before-app-mounted">
      <noscript>You need to enable JavaScript to run this Website.</noscript>
      <div class="loading-box">
        <div class="loading loading-bars" aria-hidden="true"><span></span><span></span><span></span></div>
        <div class="loading-title">正在初始化应用...</div>
        <div class="loading-error">
          <div class="error-title">Error</div>
          <div class="error-message"></div>
          <button class="error-button" onclick="location.reload()">Reload</button>
        </div>
      </div>
    </div>
    <div id="app-mount-point" style="width: 100vw; overflow: auto"></div>
    <script src="./northstar-v10.js?v=20260819-15"></script>
  </body>
</html>
